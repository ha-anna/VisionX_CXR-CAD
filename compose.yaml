services:
  api:
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    command:
      - python
      - -m
      - uvicorn
      - src.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_BUNDLE_DIR: /models/demo
    volumes:
      - ./models/demo:/models/demo:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  dashboard:
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    command:
      - python
      - -m
      - streamlit
      - run
      - src/dashboard/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
