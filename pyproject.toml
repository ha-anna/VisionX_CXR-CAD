[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "models",
    "data",
    "notebooks",
    "metadata",
    "configs",
    "checkpoints",
    "i18n.py",
    "styles.py"
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true